// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        maven { url 'https://repo1.maven.org/maven2' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        maven { url 'https://repo1.maven.org/maven2' }
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-auth:21.0.0'
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            if (project.android.namespace == null) {
                if (project.name == "capacitor-plugin-send-intent") {
                    project.android.namespace = "com.gustavosanjose.capacitorpluginsendintent"
                } else {
                    project.android.namespace = "com.avelut.plugin.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
